<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صالون أكرم للحلاقة - Barber Akram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK v10 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyAI3L5P-JG7yAbqlgLl",
      authDomain: "barber-kimou.firebaseapp.com",
      projectId: "barber-kimou",
      storageBucket: "barber-kimou.firebasestorage.app",
      messagingSenderId: "360525898197",
      appId: "1:360525898197:web:f55b81"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const ADMIN_PIN = "200319";
    const MINUTES_PER_CLIENT = 35;

    function App() {
      const [view, setView] = React.useState('client');
      const [pinInput, setPinInput] = React.useState('');
      const [pinError, setPinError] = React.useState(false);
      const [isAuthenticated, setIsAuthenticated] = React.useState(false);

      const [queue, setQueue] = React.useState([]);
      const [clientName, setClientName] = React.useState('');
      const [clientPhone, setClientPhone] = React.useState('');
      const [service, setService] = React.useState('حلاقة شعر');
      const [isShopOpen, setIsShopOpen] = React.useState(true);

      const [manualName, setManualName] = React.useState('');
      const [manualPhone, setManualPhone] = React.useState('');
      const [manualService, setManualService] = React.useState('حلاقة شعر');

      React.useEffect(() => {
        const unsubQueue = db.collection('queue').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setQueue(data);
        });

        const unsubSettings = db.collection('settings').doc('shopStatus').onSnapshot(doc => {
          if (doc.exists) {
            setIsShopOpen(doc.data().isOpen);
          } else {
            db.collection('settings').doc('shopStatus').set({ isOpen: true });
          }
        });

        return () => {
          unsubQueue();
          unsubSettings();
        };
      }, []);

      const handleAddClient = async (e) => {
        e.preventDefault();
        if (!clientName.trim()) return;
        if (!isShopOpen) {
          alert('الصالون مغلق حالياً، لا يمكن الحجز الآن.');
          return;
        }

        await db.collection('queue').add({
          name: clientName,
          phone: clientPhone || 'بدون رقم',
          service: service,
          status: 'waiting',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        setClientName('');
        setClientPhone('');
        alert('تم تسجيل حضورك في الطابور بنجاح!');
      };

      const handleManualAdd = async (e) => {
        e.preventDefault();
        if (!manualName.trim()) return;

        await db.collection('queue').add({
          name: manualName + ' (مباشر)',
          phone: manualPhone || 'مباشر بالصالون',
          service: manualService,
          status: 'waiting',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        setManualName('');
        setManualPhone('');
        alert('تمت إضافة الزبون للطابور بنجاح!');
      };

      const handleStatusChange = async (id, status) => {
        if (status === 'deleted') {
          await db.collection('queue').doc(id).delete();
        } else {
          await db.collection('queue').doc(id).update({ status });
        }
      };

      const toggleShopStatus = async () => {
        await db.collection('settings').doc('shopStatus').set({ isOpen: !isShopOpen });
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === ADMIN_PIN) {
          setIsAuthenticated(true);
          setPinError(false);
        } else {
          setPinError(true);
        }
      };

      const waitingList = queue.filter(item => item.status === 'waiting');
      const inProgressItem = queue.find(item => item.status === 'in-progress');

      return (
        <div className="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
          <header className="flex justify-between items-center mb-6 bg-gray-900 p-4 rounded-xl border border-gray-800 shadow-lg">
            <div>
              <h1 className="text-xl font-bold text-amber-400">صالون أكرم للحلاقة</h1>
              <p className="text-xs text-gray-400">مزلوق، سطيف</p>
            </div>
            <button 
              onClick={() => {
                if (view === 'client') {
                  setView('admin');
                } else {
                  setView('client');
                  setIsAuthenticated(false);
                  setPinInput('');
                }
              }}
              className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-lg border border-gray-700 transition"
            >
              {view === 'client' ? 'لوحة الحلاق' : 'واجهة الزبون'}
            </button>
          </header>

          <main className="flex-1 space-y-6">
            <div className={`p-3 rounded-lg text-center text-sm font-bold flex items-center justify-center gap-2 ${isShopOpen ? 'bg-emerald-950 border border-emerald-800 text-emerald-400' : 'bg-rose-950 border border-rose-800 text-rose-400'}`}>
              <span className={`w-2.5 h-2.5 rounded-full ${isShopOpen ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
              {isShopOpen ? 'الصالون مفتوح ويستقبل الزبائن' : 'الصالون مغلق حالياً'}
            </div>

            {view === 'client' ? (
              <div className="space-y-6">
                {waitingList.length > 0 && (
                  <div className="bg-amber-500/10 border border-amber-500/40 p-4 rounded-xl text-center space-y-1">
                    <p className="text-xs text-amber-400 font-bold">🔔 نظام التنبيه الذكي</p>
                    {inProgressItem ? (
                      <p className="text-xs text-gray-300">
                        الزبون على الكرسي: <strong className="text-amber-400">{inProgressItem.name}</strong>
                        <br/>الوقت التقديري للزبون: <span className="text-amber-400 font-bold">{MINUTES_PER_CLIENT} دقيقة</span>
                      </p>
                    ) : (
                      <p className="text-xs text-gray-300">الكرسي فارغ حالياً!</p>
                    )}
                  </div>
                )}

                <form onSubmit={handleAddClient} className="bg-gray-900 p-5 rounded-xl border border-gray-800 space-y-4">
                  <h2 className="text-lg font-bold text-gray-100 mb-2">حجز دور جديد</h2>
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1">الاسم الكامل *</label>
                    <input 
                      type="text" 
                      required 
                      value={clientName} 
                      onChange={e => setClientName(e.target.value)}
                      placeholder="أدخل اسمك الكريم"
                      className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-500 text-gray-100"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-400 mb-1">رقم الهاتف (اختياري)</label>
                    <input 
                      type="tel" 
                      value={clientPhone} 
                      onChange={e => setClientPhone(e.target.value)}
                      placeholder="06XXXXXXXX"
                      className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-50
